name: Complete 10-15 WeChat article images
on:
  workflow_dispatch:
  push:
    paths:
      - '10-15/image_sources.json'
permissions:
  contents: write
jobs:
  fill-images:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow requests cairosvg
      - name: Fetch licensed images and prepare covers
        run: python scripts/complete_wechat_images.py 10-15/image_sources.json
      - name: Publish verified image assets and article links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 10-15
          if ! git diff --cached --quiet; then
            git commit -m 'Add licensed article illustrations and standalone WeChat covers'
            git push origin HEAD:main
          fi
