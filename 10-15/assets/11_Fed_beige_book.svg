<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="美联储褐皮书：关注三个信号"><rect width="1200" height="650" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="14" fill="#2868AC"/><g font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><text x="72" y="82" font-size="23" fill="#2868AC" font-weight="650" text-anchor="start">12 个地区联储的企业调查</text><text x="72" y="145" font-size="43" fill="#17243C" font-weight="750" text-anchor="start">美联储褐皮书：关注三个信号</text><path d="M72 173 H1128" stroke="#D8E0EC" stroke-width="2"/><rect x="72" y="218" width="338" height="290" rx="20" fill="#fff"/><rect x="93" y="239" width="296" height="8" rx="4" fill="#2868AC"/><text x="95" y="305" font-size="31" fill="#17243C" font-weight="710" text-anchor="start">经营成本</text><text x="95" y="369" font-size="24" fill="#52647D" font-weight="500" text-anchor="start">能源与物流压力</text><text x="95" y="414" font-size="23" fill="#52647D" font-weight="500" text-anchor="start">行业间表现不一</text><rect x="431" y="218" width="338" height="290" rx="20" fill="#fff"/><rect x="452" y="239" width="296" height="8" rx="4" fill="#169C9C"/><text x="454" y="305" font-size="31" fill="#17243C" font-weight="710" text-anchor="start">企业招聘</text><text x="454" y="369" font-size="24" fill="#52647D" font-weight="500" text-anchor="start">部分企业趋于谨慎</text><text x="454" y="414" font-size="23" fill="#52647D" font-weight="500" text-anchor="start">AI 用于提升效率</text><rect x="790" y="218" width="338" height="290" rx="20" fill="#fff"/><rect x="811" y="239" width="296" height="8" rx="4" fill="#D48B3D"/><text x="813" y="305" font-size="31" fill="#17243C" font-weight="710" text-anchor="start">政策观察</text><text x="813" y="369" font-size="24" fill="#52647D" font-weight="500" text-anchor="start">通胀与就业权衡</text><text x="813" y="414" font-size="23" fill="#52647D" font-weight="500" text-anchor="start">并非利率决定</text><text x="72" y="598" font-size="22" fill="#66758D" font-weight="450" text-anchor="start">说明：