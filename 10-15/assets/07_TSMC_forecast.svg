<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="台积电第三季度利润：市场预测"><rect width="1200" height="650" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="14" fill="#2868AC"/><g font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><text x="72" y="82" font-size="23" fill="#2868AC" font-weight="650" text-anchor="start">分析师预期 · 非正式财报</text><text x="72" y="145" font-size="43" fill="#17243C" font-weight="750" text-anchor="start">台积电第三季度利润：市场预测</text><path d="M72 173 H1128" stroke="#D8E0EC" stroke-width="2"/><rect x="72" y="213" width="517" height="297" rx="26" fill="#fff"/><rect x="90" y="231" width="7" height="80" rx="3" fill="#2868AC"/><text x="114" y="277" font-size="27" fill="#66758D" font-weight="650" text-anchor="start">预测净利润</text><text x="114" y="371" font-size="54" fill="#2868AC" font-weight="790" text-anchor="start">7463 亿</text><text x="114" y="432" font-size="23" fill="#56647A" font-weight="480" text-anchor="start">新台币</text><rect x="611" y="213" width="517" height="297" rx="26" fill="#fff"/><rect x="629" y="231" width="7" height="80" rx="3" fill="#169C9C"/><text x="653" y="277" font-size="27" fill="#66758D" font-weight="650" text-anchor="start">预测同比增幅</text><text x="653" y="371" font-size="54" fill="#169C9C" font-weight="790" text-anchor="start">约 65%</text><text x="653" y="432" font-size="23" fill="#56647A" font-weight="480" text-anchor="start">分析师估算</text><text x="72" y="598" font-size="22" fill="#66758D" font-weight="450" text-anchor="start">说明：正式披露前的市场预期，不应视为已实现业绩。</text></g></svg>