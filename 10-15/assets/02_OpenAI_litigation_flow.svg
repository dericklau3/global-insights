<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="美国八州诉讼的法律进程"><rect width="1200" height="650" fill="#F5F7FB"/><rect x="0" y="0" width="1200" height="14" fill="#2868AC"/><g font-family="'PingFang SC','Microsoft YaHei',Arial,sans-serif"><text x="72" y="82" font-size="23" fill="#2868AC" font-weight="650" text-anchor="start">产品安全争议 · 未经司法认定</text><text x="72" y="145" font-size="43" fill="#17243C" font-weight="750" text-anchor="start">美国八州诉讼的法律进程</text><path d="M72 173 H1128" stroke="#D8E0EC" stroke-width="2"/><rect x="72" y="235" width="253.5" height="260" rx="23" fill="#fff"/><text x="94" y="277" font-size="24" fill="#2A78A9" font-weight="650" text-anchor="start">01</text><text x="94" y="349" font-size="29" fill="#1A2942" font-weight="730" text-anchor="start">州政府起诉</text><text x="94" y="413" font-size="20" fill="#576780" font-weight="450" text-anchor="start">围绕安全设计</text><path d="M322.5 367 l17 0" stroke="#2A78A9" stroke-width="4"/><rect x="339.5" y="235" width="253.5" height="260" rx="23" fill="#fff"/><text x="361.5" y="277" font-size="24" fill="#2A78A9" font-weight="650" text-anchor="start">02</text><text x="361.5" y="349" font-size="29" fill="#1A2942" font-weight="730" text-anchor="start">双方举证</text><text x="361.5" y="413" font-size="20" fill="#576780" font-weight="450" text-anchor="start">主张与抗辩</text><path d="M590 367 l17 0" stroke="#2A78A9" stroke-width="4"/><rect x="607" y="235" width="253.5" height="260" rx="23" fill="#fff"/><text x="629" y="277" font-size="24" fill="#2A78A9" font-weight="650" text-anchor="start">03</text><text x="629" y="349" font-size="29" fill="#1A2942" font-weight="730" text-anchor="start">法院审理</text><text x="629" y="413" font-size="20" fill="#576780" font-weight="450" text-anchor="start">审查事实和法律</text><path d="M857.5 367 l17 0" stroke="#2A78A9" stroke-width="4"/><rect x="874.5" y="235" width="253.5" height="260" rx="23" fill="#fff"/><text x="896.5" y="277" font-size="24" fill="#